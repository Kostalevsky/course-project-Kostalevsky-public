      Обновление до версии 0.0.18 возможно только через обновление FastAPI/Starlette.
    issue: "https://github.com/Kostalevsky/course-project-Kostalevsky-public/issues/5#issue-3687057523"
    expires_at: "2025-12-31"
    approved_by: "tutor"
