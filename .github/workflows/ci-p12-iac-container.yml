name: P12 - IaC & Container Security

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "iac/**"
      - "security/**"
      - ".github/workflows/ci-p12-iac-container.yml"

permissions:
  contents: read

concurrency:
  group: p12-iac-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p12-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P12

      - name: Build image
        run: docker build -t course-app:p12 .

      - name: Hadolint Dockerfile (JSON report)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            hadolint/hadolint \
            hadolint -f json /work/Dockerfile \
            > EVIDENCE/P12/hadolint_report.json || true

      - name: Checkov IaC (JSON report)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            bridgecrew/checkov \
            -d /work/iac \
            -o json \
            --compact \
            > EVIDENCE/P12/checkov_report.json || true

      - name: Trivy image scan (JSON report)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/work" \
            aquasec/trivy \
            image course-app:p12 \
            --format json \
            --output /work/EVIDENCE/P12/trivy_report.json || true

      - name: Show evidence files
        if: always()
        run: |
          echo "=== EVIDENCE/P12 ==="
          ls -la EVIDENCE/P12 || true

      - name: Upload P12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P12_EVIDENCE
          path: EVIDENCE/P12
