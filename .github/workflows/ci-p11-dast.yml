name: P11 - DAST

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"
      - "docker-compose.yaml"
      - "requirements*.txt"
      - ".github/workflows/ci-p11-dast.yml"

permissions:
  contents: read

concurrency:
  group: p11-dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure evidence dirs
        run: mkdir -p EVIDENCE/P11

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image
        run: docker build -t course-app:p11 .

      - name: Run app container
        run: |
          set -euo pipefail

          docker run -d --name app -p 8000:8000 --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            -e DATABASE_URL=sqlite:////data/flashcards.db \
            -v app_data:/data \
            course-app:p11

          echo "→ Waiting for health endpoint..."
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "✓ App is ready"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "✗ App did not become ready"
              docker logs app || true
              exit 1
            fi
            sleep 2
          done

      - name: ZAP Baseline (scan localhost)
        run: |
          set -euo pipefail

          docker run --rm --network host -v $PWD:/zap/wrk:rw owasp/zap2docker-stable \
            zap-baseline.py \
              -t http://127.0.0.1:8000 \
              -r zap_baseline.html \
              -J zap_baseline.json \
              -d || true

          mv -f zap_baseline.html EVIDENCE/P11/zap_baseline.html || true
          mv -f zap_baseline.json EVIDENCE/P11/zap_baseline.json || true

      - name: Summarize alerts (High/Medium/Low)
        if: always()
        run: |
          python - <<'PY'
          import json, re, pathlib
          p = pathlib.Path("EVIDENCE/P11/zap_baseline.json")
          if not p.exists():
              print("No zap_baseline.json found")
              raise SystemExit(0)

          data = json.loads(p.read_text(encoding="utf-8"))
          alerts = []
          for site in data.get("site", []):
              alerts.extend(site.get("alerts", []))

          def lvl(a):
              rd = a.get("riskdesc", "") or ""
              m = re.match(r"([A-Za-z]+)", rd)
              return (m.group(1) if m else rd) or "Unknown"

          counts = {}
          for a in alerts:
              counts[lvl(a)] = counts.get(lvl(a), 0) + 1

          total = len(alerts)
          print("ZAP alerts summary:")
          for k in ["High", "Medium", "Low", "Informational", "Unknown"]:
              if k in counts:
                  print(f"  {k}: {counts[k]}")
          print(f"  Total: {total}")
          PY

      - name: Upload P11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P11_EVIDENCE
          path: EVIDENCE/P11

      - name: Stop container
        if: always()
        run: |
          docker rm -f app || true
          docker volume rm app_data || true
