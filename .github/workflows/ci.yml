name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint & Format
        run: |
          ruff check --output-format=github .
          black --check .
          isort --check-only .

      - name: Tests
        run: pytest -q

      - name: Pre-commit (all files)
        run: pre-commit run --all-files

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: hadolint.yml

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: course-app:ci
          load: true

      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: course-app:ci
          format: sarif
          output: trivy-image.sarif
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-image.sarif

      - name: Run container
        run: |
            set -euo pipefail

            docker run -d --name app -p 8000:8000 --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
              --security-opt no-new-privileges:true \
              --cap-drop ALL \
              -e DATABASE_URL=sqlite:////data/flashcards.db \
              -v app_data:/data \
              course-app:ci

            echo "→ Ждём, пока приложение поднимется (до ~60 секунд)..."
            for i in {1..30}; do
              # !!! проверяем с хоста, а не через docker exec
              if curl -sf http://127.0.0.1:8000/health > /dev/null; then
                echo "✓ health endpoint отвечает"
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "✗ Приложение не ответило по /health за отведённое время"
                echo "Логи контейнера:"
                docker logs app || true
                exit 1
              fi

              sleep 2
            done

            echo "→ Проверяем, что процесс не под root..."
            UID_IN=$(docker exec app id -u)
            if [ "$UID_IN" = "0" ]; then
              echo "✗ Процесс внутри контейнера запущен от root"
              exit 1
            fi
            echo "✓ non-root uid = $UID_IN"

      - name: Stop container
        if: always()
        run: |
          docker rm -f app || true
          docker volume rm app_data || true
