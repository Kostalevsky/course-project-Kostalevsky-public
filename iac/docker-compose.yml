version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: course-app:hardening
    ports:
      - "8000:8000"
    # env_file:
    #   - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/flashcards.db}
    volumes:
      - app_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport sys,urllib.request,json\n\ntry:\n  r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)\n  sys.exit(0 if r.status==200 and json.loads(r.read()).get('status')=='ok' else 1)\nexcept Exception:\n  sys.exit(1)\nPY"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  app_data:
